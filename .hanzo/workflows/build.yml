# Builds the image. It does NOT roll it out: git.hanzo.ai is pinned to an
# explicit tag in hanzoai/universe (crs/git.yaml) and rolled by a reviewed
# change there, which is what hanzo.yml means by having no `deploy:` section.
#
# A `kubectl patch` of the App used to live here. It never took: ArgoCD's
# universe-crs Application runs with selfHeal, so it restores the CR from the
# universe pin on the next poll and the patch is undone. Recording the tag in
# universe is the only durable path, and for this service that is deliberately
# a human decision.
name: build
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: hanzo-linux-amd64
    steps:
      - uses: actions/checkout@v4
      - name: Build + push image
        run: |
          SHA="${GITHUB_SHA::8}"
          buildctl-daemonless.sh build --frontend=dockerfile.v0 \
            --opt context="${{ github.server_url }}/${{ github.repository }}.git#${GITHUB_SHA}" \
            --opt filename=Dockerfile --opt platform=linux/amd64 \
            --secret id=GIT_AUTH_TOKEN,env=GIT_AUTH_TOKEN \
            --output "type=image,name=ghcr.io/hanzoai/git:${SHA},push=true" --progress=plain
        env:
          GIT_AUTH_TOKEN: ${{ secrets.GIT_CLONE_TOKEN }}
