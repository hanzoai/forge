# Canonical CI/CD config for hanzoai/git — read by both the hanzoai/ci reusable
# workflow (.github/workflows/cicd.yml) and platform.hanzo.ai. One image: the
# multi-stage root Dockerfile builds the web frontend and the `gitd` daemon and
# bakes in the Hanzo Git branding (logo, favicon, app name, footer). git.hanzo.ai
# runs this image via the `git` operator App CR in hanzoai/universe; config is
# injected via the GIT__<section>__<KEY> env contract. No deploy: here — the App
# CR pins a semver tag, bumped by a reviewed universe change, not auto-rolled.
#
# No platforms: — the default is amd64 and arm64, which is what this Dockerfile
# already builds: the frontend stage pins $BUILDPLATFORM and the Go stages take
# the target, so each architecture compiles natively on the node that serves it.
# A single-arch image here strands the forge on one half of the fleet.
#
# GIT_VERSION reaches the Makefile as the VERSION file. The build context is an
# export rather than a clone, so without this arg the daemon reports
# 0.0.0+unknown and no running forge can name the build it came from.
version: 1.26.56
images:
  - name: git
    context: .
    dockerfile: Dockerfile
    repo: ghcr.io/hanzoai/git
    args:
      GIT_VERSION: ${VERSION}

# The Go + frontend compile happens inside the Dockerfile, so a broken tree fails
# the image build already. This gate stays light and targeted: the setting unit
# tests exercise the config-env prefix + work/custom path resolution the running
# deploy depends on.
test:
  - name: go-test-setting
    run: go test ./modules/setting/...
  # Scoped by -run rather than taking the whole package: this gate exists for the
  # task context a runner reads, and the actions suite is broad enough that an
  # unrelated failure here would read as a config regression.
  - name: go-test-actions-context
    run: go test ./services/actions/ -run 'TestGitContext|Test_jobEmitterQueueHandler'
