# Hanzo Git — image build (amd64, self-hosted hanzoai ARC pool).
#
# Hanzo Git is a WHITE-LABEL FORK of Gitea, pinned to the SAME upstream version
# git.hanzo.ai runs (v1.24.7). This builds OUR branded image so the live service
# ships ghcr.io/hanzoai/git instead of stock gitea/gitea.
#
# Private repo, but SELF-CONTAINED (does not call the private hanzoai/.github
# reusable workflow) so it targets the always-online `hanzo-build-linux-amd64`
# ARC scale set directly — the same proven pattern as the hanzoai/chat fork.
#
# Builds ghcr.io/hanzoai/git on:
#   - v* tags      -> semver image tag (v1.24.7-hanzo.1 -> 1.24.7-hanzo.1)
#   - push to main -> immutable sha-<sha7> tag (traceability)
# No :latest, no floating tags (semver-only policy). amd64 only (DOKS is all
# amd64). The reported binary version comes from the root VERSION file, so it is
# deterministic and does not depend on .git inside the build.
name: Docker Release

on:
  push:
    branches: [standalone]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-amd64:
    # hanzoai org pool — ARC routes by runnerScaleSetName, not labels.
    runs-on: hanzo-build-linux-amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hanzoai/git
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
          flavor: |
            latest=false

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/hanzoai/git-cache:amd64
          cache-to: type=registry,ref=ghcr.io/hanzoai/git-cache:amd64,mode=max
          provenance: false
