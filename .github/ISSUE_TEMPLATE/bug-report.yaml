name: Bug Report
description: Something isn't working as expected.
labels: ["type/bug"]
body:
  - type: markdown
    attributes:
      value: |
        - **Security issue?** Email security@hanzo.ai instead of opening a public issue.
        - **Need help** with setup or configuration? See [the documentation](https://docs.hanzo.ai).
        - Search [existing issues](https://github.com/hanzoai/forge/issues?q=is%3Aissue) first.
  - type: input
    id: forge-ver
    attributes:
      label: Hanzo Forge Version
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected to happen, and what happened instead. Include logs if relevant.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: How are you running Hanzo Forge?
      description: Install method (binary, Docker, package), operating system, and database.
